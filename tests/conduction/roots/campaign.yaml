# The SET of the patterns -- twenty-six witness roots, one sub-directory each, played by
# tools/campaign/campaign.py (`--set tests/conduction/roots`, its default): the six patterns of the
# engine, then twenty ordinary situations of a conducted turn (a long reading, a gesture during a
# held output, a section break, a mount, a name not offered, a bare call, a stubborn miss, a stray
# production, a production written in the message and never printed, a space opened and closed, a compaction declared, a package switched off and on, a
# wake-up bounded under what the root takes, a value's call typed again while the output waits, a run
# renewed between two launches, a member rewritten during the passage, a space opened by a principal, a space whose
# last step calls a proc, a member's exchange under its team's root, the team package's TEAMS space) -- each described
# by what one looks at, never by the zone it crosses.
# Each root EXPECTS counts (`expect:`), judged per exchange by the sheet: the `words` of the whole
# exchange (every production printed, the boot's table and the turn's line included -- the last message of a launch
# is no words), the launches, the passage parked, the proofs. The counts are the modelled LLM's.
# `launches:` bounds the wake-up for that root alone (the plan's `--launches`
# otherwise); `renew: true` plays the exchange in two wake-ups, the run renewed between them; `again:`
# is the principal's next message, played as a second wake-up once the passage parked.
name: patterns
agent: agents/pat
files:                       # accessories laid in the agent's workspace: <name there>: <path under the set>
  LINES.txt: LINES.txt
skills:                      # witness skills copied into the agent's instance (`.pp/skills/<name>`)
  - ../_skills/pp-cyclewit
  - ../_skills/pp-memberwit
packages: [team]             # the house carries the team package: its contributors TEAM_INBOX and TEAM_ROSTER are mounted at the kit's socket turn.begin, at every exchange
clean:                       # what an exchange leaves in the agent's workspace, removed before the next one
  - .pp/cyclewit.done
keep:                        # what an exchange may rewrite, put back before the next one as the house laid it
  - .pp/MEMBER.md
silent:                      # the zones no root crosses yet, each with the batch or the step that owes it (tests/conduction/census.py)
  print-refused: le-jeu-du-catalogue (plan moteur-0.2.0) -- a root whose intention prints off the form of its step
  print-waived: le-jeu-du-catalogue (plan moteur-0.2.0) -- the same root, refused up to the bound
roots:
  read-lines:
    door: READ_LINES.md
    message: Read the four lines of LINES.txt one at a time and say each line as you read it.
    manual: "Open the door READ_LINES offered to you and play it: read the four lines of LINES.txt one at a time, say each line as you read it."
    look: 4 `words` said as the lines are read, each under its header; nothing said twice
    model:
      - read: LINES.txt
    expect:
      words: 4   # the productions printed: a launch's last message is no words
      launches: 1
      parked: true
      proofs: 0
  laps:
    door: LAPS.md
    message: "Play the door: one line per element, in order."
    manual: "Open the door LAPS offered to you and play it: one line per element, in order."
    look: the field asked once (`INFER field`), one `words` per lap under `LAPS`, the proof of LP1 at the exit
    model:
      - field: [alpha, beta, gamma]
    expect:
      words: 6   # the productions printed: a launch's last message is no words
      launches: 5   # each lap a block never served, held: one launch per output the house serves
      parked: true
      proofs: 3
  cycle:
    door: CYCLE.md
    message: "Play the door: one line per element the witness provides."
    manual: "Open the door CYCLE offered to you and play it: one line per element the witness provides."
    look: three laps, one `words` each; the sink fed (`cyclewit.done` in the agent's instance grows a line per lap)
    model:
      - echo: cyclewit-items
    expect:
      words: 3   # the productions printed: a launch's last message is no words
      launches: 4   # each lap a block never served, held: one launch per output the house serves
      parked: true
      proofs: 0
  route:
    door: ROUTE.md
    message: "Route the ask: the number is 7."
    manual: "Open the door ROUTE offered to you and route the ask: the number is 7."
    look: STAGE's `words`, a silent `PICK next` (LEFT), LEFT's `words`; two frames of depth, never three
    model:
      - pick: LEFT
    expect:
      words: 5   # the productions printed: a launch's last message is no words
      launches: 2
      parked: true
      proofs: 0
  begin:
    message: Say hello in one line.
    look: BEGIN's `words` BEFORE the WORK's, its law BG1 asked at the turn's checkpoint
    expect:
      words: 4   # the productions printed: a launch's last message is no words
      launches: 1
      parked: true
      proofs: 1
  review:
    message: Say hello in one line; before finishing, open the REVIEW door offered to you.
    look: REVIEW's `words` between the WORK's, the door's frame pushed then popped, the WORK resumed
    model:
      - open: REVIEW
    expect:
      words: 3   # the productions printed: a launch's last message is no words
      launches: 2
      parked: true
      proofs: 0
  long-read:
    door: LONG_READ.md
    message: "Read the long text served to you and say its last numbered line."
    manual: "Open the door LONG_READ offered to you: read the long text it serves and say its last numbered line."
    look: "the reading is longer than one prompt holds; the WORK and the fork that follow it each have a long brief: a first piece that carries no step of the door and closes on `▶ MORE`, then a second that carries the WORK and the fork; the WORK's production is printed only once the last piece is read"
    expect:
      words: 5   # the productions printed: a launch's last message is no words
      launches: 3
      parked: true
      proofs: 0
  gesture-while-held:
    door: REVIEW.md
    message: "Say hello in one line; open the REVIEW door offered to you, then ask the witness what is next."
    manual: "Say hello in one line; open the REVIEW door offered to you, then play `pp-cyclewit next`."
    look: "REVIEW's production between the WORK's; the script called after `pp: opened` -- what pp answers to a gesture while an output waits"
    model:
      - open: REVIEW
      - gesture: -s pp-cyclewit next
    expect:
      words: 4   # the productions printed: a launch's last message is no words
      launches: 2
      parked: true
      proofs: 0
  two-steps:
    door: TWO_STEPS.md
    message: "Say « first », then « second »."
    manual: "Open the door TWO_STEPS offered to you and play its two steps."
    look: "two productions, one per step, the section break between them -- one launch per step"
    expect:
      words: 5   # the productions printed: a launch's last message is no words
      launches: 2
      parked: true
      proofs: 0
  mounted:
    door: HELLO.md
    message: "Mount NOTE, then say one line."
    manual: "Mount the document NOTE (`./pp <key> -mount NOTE.md`), then say one line."
    look: "the mount answered during the WORK -- NOTE.md a document of the root, mounted by its name; `pp: mounted` and the block that stands served at the next launch under NOTE's law; the WORK's production printed then"
    model:
      - gesture: -mount NOTE.md
    expect:
      words: 4   # the productions printed: a launch's last message is no words
      launches: 2
      parked: true
      proofs: 0
  unoffered:
    door: HELLO.md
    message: "Say hello, then play the name NOBODY."
    manual: "Say hello in one line, then play the name NOBODY (`./pp <key> -s NOBODY`)."
    look: "the name is not offered -- the block that stands comes back in the tool result with its DEVIATION, rc 2, nothing done; then the WORK is said and the turn handed back"
    model:
      - gesture: -s NOBODY
    expect:
      words: 4   # the productions printed: a launch's last message is no words
      launches: 1
      parked: true
      proofs: 0
  bare-call:
    door: PROOF.md
    message: "Say « proven »; the proof is due."
    manual: "Open the door PROOF offered to you: say « proven », then type the bare call where the proof is due."
    look: "the bare call where a value is due -- `principal-advances` in the tool result, then the empty answer repaired at the next launch"
    model:
      - bare: true
    expect:
      words: 5   # the productions printed: a launch's last message is no words
      launches: 3
      parked: true
      proofs: 2
  stubborn:
    door: STUBBORN.md
    message: "Say « stubborn ». At EVERY proof asked -- the first and each one a REPAIR asks again -- hand exactly this: [{\"code\":\"ST1\",\"evidence\":\"not verified\",\"verdict\":\"fail\"}] -- a bare fail, no fix, no blocked, never an ok. Go on until the tool refuses; then say what it said and stop."
    manual: "Open the door STUBBORN offered to you, then do what the message says: a bare fail at every proof, until the tool refuses."
    look: "a bare fail at every proof -- one repair after the other up to the bound, then the refusal that stops the conduction (`repair-exhausted`): what the agent is told, and the run parked on its step for the principal's word, the launcher stopping by itself"
    model:
      - persist: bare-fail
    expect:
      words: 4   # the productions printed: a launch's last message is no words
      launches: 1
      parked: true
  stray:
    door: STRAY.md
    message: "Say « stray », then « said »."
    manual: "Open the door STRAY offered to you: hand your first line to the tool instead of saying it, then say the second."
    look: "a production handed by the value call where its print call was due -- the block that stands comes back with its deviation naming the print, nothing recorded, no repair; then the production printed, the run moving on; the `rouge-agent` on the handed line is the agent's own miss, wanted"
    model:
      - stray: true
    expect:
      words: 5   # the productions printed: a launch's last message is no words
      launches: 3
      parked: true
      proofs: 0
  unprinted:
    door: UNPRINTED.md
    message: "Say « unprinted », then « said »."
    manual: "Open the door UNPRINTED offered to you: write its line in your message without handing it to the tool, then say « said »."
    look: "a production asked on `terminal` written in the agent's message, no print call -- its advance comes back with the block that stands and the print it names, the agent prints, then hands back"
    model:
      - unprinted: true
    expect:
      words: 8   # the productions printed: a launch's last message is no words
      launches: 2
      parked: true
      proofs: 0
  space:
    door: HELLO.md
    message: "Open the space ROOM offered to you, say its line, then close it and say hello."
    manual: "Open the space ROOM (`./pp <key> -open ROOM`), say its line, close it (`./pp <key> -close`), then say hello."
    look: "a space opened from the WORK and closed by the agent -- ROOM offered by two segments, `-open ROOM` alone opens it at the pending step (batch l-espace-et-son-offre: no `address-ambiguous` under -open); `pp: opened` then ROOM's block at the next launch, `pp: closed` then HELLO's WORK again; the heading names the root ROOM while it stands"
    model:
      - gesture: -open ROOM
      - gesture: -close
    expect:
      words: 6   # the productions printed: a launch's last message is no words
      launches: 3
      parked: true
      proofs: 0
  space-by-principal:
    door: HELLO.md
    message: "Say hello."
    manual: "Say hello in one line; the house then opens the space ROOM for you (`agent open`) and says hello again."
    open: ROOM
    again: "Say hello again."
    look: "a space the PRINCIPAL opens on a parked run (batch les-espaces-au-flux): the first wake-up says hello and parks; `agent open ROOM` plays `-open ROOM` under the principal's mark and launches an exchange without a message -- the output the open held served whole, ROOM's WELCOME fused with ROOM's block (the welcome's law W1 in text), both lines printed, the run parked in ROOM, the heading naming the root ROOM --; the next message replays ROOM from its first step"
    expect:
      words: 7   # the productions printed: a launch's last message is no words
      launches: 3
      parked: true
      proofs: 0
  imported-ground:
    door: HELLO.md
    message: "Say hello."
    manual: "Say hello in one line; the house then opens the space ROOM for you (`agent open`), and you say room."
    open: ROOM
    again: "Say hello again."
    look: "a door the TURN's IMPORT offers, opened by the PRINCIPAL between two exchanges (batch l-import-d-un-document): the root's TURN.md imports GROUND.md -- its law GD1 and its offer ROOM held by TURN's frame from the first block --; the first wake-up says hello and parks with ROOM still offered; `agent open ROOM` plays `-open ROOM` under the principal's mark and serves ROOM's block, GD1 in force; the next message replays ROOM from its first step"
    expect:
      words: 6   # the productions printed: a launch's last message is no words
      launches: 3
      parked: true
      proofs: 0
  ledger:
    door: DESK.md
    message: "Open the space LEDGER offered to you and say its lines; leave it open."
    manual: "Open the space LEDGER (`./pp <key> -open LEDGER`), say « ledger », then « report »; leave it open."
    again: "Say « ledger » and « report » again."
    look: "a space whose last step calls a proc (the sequence of an agent's inventory space, 01/11) -- the agent opens LEDGER, whose last step calls REPORT: the passage parks once REPORT has printed its line, the heading naming the root LEDGER; the next message serves LEDGER from its first step, never REPORT alone"
    model:
      - gesture: -open LEDGER
    expect:
      words: 6   # the productions printed: a launch's last message is no words
      launches: 5   # REPORT's block, never served, held: one launch more
      parked: true
      proofs: 0
  compacted:
    door: HELLO.md
    message: "Say hello; before that, declare that your conversation was summarized."
    manual: "Declare a compaction (`./pp <key> -compacted`), then say hello in one line."
    look: "the run served back after a declared compaction -- `pp: re-served` and the boot's readings again at the next launch with the WORK that stands; the line printed after it"
    model:
      - gesture: -compacted
    expect:
      words: 5   # the productions printed: a launch's last message is no words
      launches: 2
      parked: true
      proofs: 0
  switched:
    door: HELLO.md
    message: "Say hello; switch the package agent off for this run, then on again."
    manual: "Switch the package agent off (`./pp <key> -disable agent`) then on (`./pp <key> -enable agent`), then say hello."
    look: "a package switched off then on for the run -- the word said on one line and the block that stands in the tool result, twice; the run never moves; one launch"
    model:
      - gesture: -disable agent
      - gesture: -enable agent
    expect:
      words: 4   # the productions printed: a launch's last message is no words
      launches: 1
      parked: true
      proofs: 0
  bounded:
    door: BOUNDED.md
    message: "Say « first », then « second »."
    manual: "Open the door BOUNDED offered to you and play its two steps."
    launches: 1
    look: "the launcher's bound reached -- one launch allowed where the two steps take two: `launches-spent` (rc 2), the second step's output kept pending for the next wake-up, the passage not over by nature"
    expect:
      words: 1   # the productions printed: a launch's last message is no words
      launches: 1
      parked: false
      proofs: 0
  bouncing:
    door: PROOF.md
    message: "Say « proven »; the proof is due. Once your proof is judged, hand it again."
    manual: "Open the door PROOF offered to you: say « proven », hand the proof; once `pp: value judged` answers, type the same call again."
    look: "a call that moves the run typed while the output waits -- `pp: not played -- call already done` to the proof handed a second time, nothing lost, the held output served at the next launch (the `rouge-agent` on the held line is the agent's own miss, wanted)"
    model:
      - bounce: true
    expect:
      words: 4   # the productions printed: a launch's last message is no words
      launches: 2
      parked: true
      proofs: 1
  renewed:
    door: RENEWED.md
    message: "Say « first », then « second »."
    manual: "Open the door RENEWED offered to you and play its two steps; between them the house is upgraded."
    renew: true
    look: "the run renewed between its two launches -- the first wake-up bounded at one launch, the run's slot a renewal mark, the second wake-up taking it up by `--run`: `reopened` on its trace, the boot served again on its reopening, the message it carried unplayed (the run waited for a production)"
    expect:
      words: 4   # the productions printed: a launch's last message is no words
      launches: 2
      parked: true
      proofs: 0
  rewritten:
    door: REWRITTEN.md
    message: "Say « rewritten »; before that, rewrite your member with the gesture offered to you."
    manual: "Rewrite your member (`./pp <key> -s pp-memberwit grow`) during the step, then say « rewritten »."
    again: "Say « rewritten » again."
    look: "a document of the run rewritten during the passage -- the member's SERVE step toggled while MEMBER is a frame: the passage ends on the steps it began with, no refusal; the next message takes the run up reseated (`reseated` on its trace), nothing of the boot replayed"
    model:
      - gesture: -s pp-memberwit grow
    expect:
      words: 5   # the productions printed: a launch's last message is no words
      launches: 2
      parked: true
      proofs: 0
  member:
    message: "Your lead handed you the draft LINES.txt: review it and say in a few lines what holds and what is missing."
    manual: "Read LINES.txt, the draft your lead handed you, and say in a few lines what holds and what is missing."
    look: "the exchange of the member reviewer, its team's directory as the run's root of documents: TEAM-crew.md, attached at turn.begin, serves the intention, TEAM_WORK.md and the members' sheet, each body once; TEAM-crew-review.md, the document of reviewer's role key inspect, lies in that directory with mount: turn.begin, so the engine mounts it at every exchange -- in a team's run pp-team mounts it through the member's vector, and a campaign passes no vector --; its law TM1 is proven at the turn's checkpoint; TURN.md lies in that directory too, the overlay of the kit's turn that team start writes in a team's directory (output: team-act and nothing else): the WORK line of the turn asks for the form team-act"
    expect:
      words: 3   # the productions printed: a launch's last message is no words
      launches: 1
      parked: true
      proofs: 1                # the turn's checkpoint, TM1 of the role's document among its codes
  teams-space:
    door: HELLO.md
    message: "Open the space TEAMS and write there the team crew from the template solo, described as « Reviews the notes of the house. »: one member, worker, played by agents/pat, with the role key readers. Then write its first season on the contract `files`, with contributors=readers, reviewers=readers, source-folder=notes/sources, draft-folder=notes/drafts, result-folder=notes/results. Do not start the team; leave the space open."
    manual: "Open the space TEAMS (`./pp <key> -open TEAMS`), write the team with `./pp <key> -s pp-team declare crew --template solo --description 'Reviews the notes of the house.' --member worker agents/pat --role readers worker`, then its season with `./pp <key> -s pp-team declare crew --season --template files --value contributors=readers --value reviewers=readers --value source-folder=notes/sources --value draft-folder=notes/drafts --value result-folder=notes/results`; do not start the team, leave the space open."
    look: "the TEAMS space of the team package, opened from HELLO's WORK: its welcome TEAMS-BOARD printed as tables over its two readings, the board and the templates; then TEAMS's own block, which serves TEAM_WORK.md and the cheat sheet -- cut in pieces where the cap asks -- and asks its WORK; the passage parks in TEAMS, the heading naming the root TEAMS. A real model writes the team there with `team declare`, then its season with `team declare --season`, and never plays `team start`; the modelled LLM only opens the space and writes nothing"
    model:
      - gesture: -open TEAMS
    expect:
      words: 6   # the productions printed: a launch's last message is no words
      launches: 2
      parked: true
      proofs: 0
