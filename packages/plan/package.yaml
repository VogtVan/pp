name: plan
version: 0.1.50
description: >-
  Plans live as documents the pp-plan skill alone structures --
  plans/<slug>/ under the instance root, one document per plan, phase and batch,
  child progress carried by the front matters, prose owned by humans and agents.
  Every mutating call holds the plan's next move: the steering pass carries it
  when steering is there, `pp-plan next-move` reads it back on demand.
requires: [kit]
optional: [steering]
contributes:
  events:
    sectors:
      plan: {cap: 3, icon: 📋}
    vectors:
      plan: {verify: pp-plan}
      plan-phase: {verify: pp-plan}
      plan-lot: {verify: pp-plan}
    signals:
      plan-next-move: {sector: plan, priority: 1, standing: true, door: PLAN}
