name: plan
version: 0.8.0
description: >-
  Plans live as documents the pp-plan skill alone structures --
  plans/<slug>/ under the instance root, one document per node,
  child progress carried by the front matters, prose owned by humans and agents.
  Every mutating call holds the plan's next move: NEXT carries it at the end of
  the answer when the package next is there, `pp-plan next-move` reads it back
  on demand.
requires: [kit]
optional: [steering, next]
contributes:
  events:
    sectors:
      plan: {cap: 3, icon: 📋}
    vectors:
      plan: {verify: pp-plan}
    signals:
      plan-next-move: {sector: plan, priority: 1, standing: true, door: PLAN}
