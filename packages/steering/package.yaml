name: steering
version: 1.4.0
description: >-
  The steps of work owed in the workspace, with their labels, priority and
  level -- kept in three records of the instance's store, `steps`, `labels`
  and `counters`, which its skill pp-steering alone writes. Its settings wear
  the `steering_` prefix.
requires: [kit]
contributes:
  commands:
    - {verb: steering, skill: pp-steering, args: [view]}
